<template>
    <!-- Modal Popup - renderKey로 전체 모달 재렌더링 -->
    <div key={renderKey}>
        <section class="slds-modal slds-fade-in-open slds-modal_small" role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button type="button" title="Cancel and close" class="slds-button slds-button_icon slds-modal__close slds-button_icon-bare" onclick={handleCancel}>
                        <svg focusable="false" aria-hidden="true" viewBox="0 0 520 520" class="slds-button__icon slds-button__icon_large">
                            <g>
                                <path d="M310 254l130-131c6-6 6-15 0-21l-20-21c-6-6-15-6-21 0L268 212a10 10 0 01-14 0L123 80c-6-6-15-6-21 0l-21 21c-6 6-6 15 0 21l131 131c4 4 4 10 0 14L80 399c-6 6-6 15 0 21l21 21c6 6 15 6 21 0l131-131a10 10 0 0114 0l131 131c6 6 15 6 21 0l21-21c6-6 6-15 0-21L310 268a10 10 0 010-14z"></path>
                            </g>
                        </svg>
                        <span class="slds-assistive-text">Cancel and close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">New Assessment Question</h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Required Field Indicator -->
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <div></div>
                        <div class="slds-text-align_right">
                            <span style="color: #c23934; font-size: 13px; font-weight: bold;">*</span>
                            <span class="slds-m-left_xx-small slds-text-body_small">= Required Information</span>
                        </div>
                    </div>

                    <!-- Information Section -->
                    <section class="slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-theme_shade slds-p-around_small" style="border-radius: 0.5rem; font-size: 20px; padding: 0.25rem 0.75rem;">
                            Information
                        </h3>
                        
                        <div class="slds-p-horizontal_small slds-p-top_small">
                            <!-- Question Type -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <label class="slds-form-element__label" for="dkedu-questionType">
                                    <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                    {label.DKEDU_AQ_LBL_TYPE}
                                </label>
                                <div class="slds-form-element__control">
                                    <div class="slds-select_container">
                                        <select class="slds-select" 
                                                id="dkedu-questionType" 
                                                data-question-type="true"
                                                onchange={handleQuestionTypeChange}>
                                            <option value="">{label.DKEDU_AQ_MSG_TYPEDESCRIPTION}</option>
                                            <template for:each={questionTypeOptions} for:item="type">
                                                <option key={type.value} value={type.value} selected={type.selected}>
                                                    {type.label}
                                                </option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Question Text -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <label class="slds-form-element__label" for="dkedu-questionText">
                                    <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                    {label.DKEDU_AQ_LBL_QUESTION}
                                </label>
                                <div class="slds-form-element__control">
                                    <textarea class="slds-textarea" 
                                            id="dkedu-questionText" 
                                            placeholder={label.DKEDU_AQ_MSG_QUESTIONDESCRIPTION} 
                                            onchange={handleQuestionTextChange}
                                            rows="3"></textarea>
                                </div>
                            </div>

                            <!-- Choice Options (conditionally displayed) -->
                            <template if:true={showChoiceOptions}>
                                <div class="slds-form-element slds-m-bottom_medium">
                                    <label class="slds-form-element__label">
                                        <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                        {label.DKEDU_AQ_LBL_QUESTIONOPTION}
                                    </label>
                                    <div class="slds-form-element__control">
                                        <template for:each={choiceOptions} for:item="choice" for:index="index">
                                            <div key={choice.id} class="slds-grid slds-gutters_x-small slds-m-bottom_x-small dkedu-choice-row">
                                                <div class="slds-col slds-size_10-of-12">
                                                    <input type="text" 
                                                           class="slds-input" 
                                                           placeholder={choice.placeholder}
                                                           data-index={index}
                                                           data-id={choice.id}
                                                           onchange={handleChoiceChange} />
                                                </div>
                                                <div class="slds-col slds-size_2-of-12 slds-text-align_right">
                                                    <button type="button"
                                                            class="slds-button slds-button_icon slds-button_icon-border" 
                                                            data-id={choice.id}
                                                            onclick={removeChoice}
                                                            title="삭제"
                                                            disabled={isOnlyOneChoice}>
                                                        <lightning-icon icon-name="utility:delete" size="x-small" alternative-text="삭제"></lightning-icon>
                                                        <span class="slds-assistive-text">삭제</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </template>
                                        <div class="slds-m-top_small">
                                            <button type="button" class="slds-button slds-button_neutral" onclick={addChoice}>
                                                {label.DKEDU_AQ_BTN_OPTIONADD}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- Related Question Toggle -->
                            <div class="slds-form-element slds-m-bottom_medium dkedu-related-question-toggle">
                                <label class="slds-form-element__label" for="dkedu-relatedQuestionToggle" style="font-weight:600;">
                                    {label.DKEDU_AQ_LBL_RELATIONQUESTION}
                                </label>
                                <div class="slds-form-element__control">
                                    <div class="slds-checkbox">
                                        <input type="checkbox" 
                                               id="dkedu-relatedQuestionToggle"
                                               onchange={handleRelatedQuestionToggle} />
                                        <label class="slds-checkbox__label" for="dkedu-relatedQuestionToggle">
                                            <span class="slds-checkbox_faux"></span>
                                            <span class="slds-form-element__label slds-assistive-text">연관 질문 활성화</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Related Question Configuration -->
                            <template if:true={isRelatedQuestionEnabled}>
                                <div class="dkedu-related-question-section slds-m-bottom_medium">
                                    <!-- Parent Question Search -->
                                    <div class="slds-form-element slds-m-bottom_small">
                                        <label class="slds-form-element__label" for="dkedu-parentQuestionSearch">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            {label.DKEDU_AQ_LBL_RELATIONPARENT}
                                        </label>
                                        <div class="slds-form-element__control">
                                            <div class="slds-combobox_container">
                                                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" 
                                                     aria-expanded={isParentQuestionDropdownOpen}
                                                     aria-haspopup="listbox" 
                                                     role="combobox">
                                                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                        <input type="text" 
                                                               class="slds-input slds-combobox__input" 
                                                               id="dkedu-parentQuestionSearch"
                                                               placeholder={label.DKEDU_AQ_MSG_PARENTQUESTIONDESCRIPTION}
                                                               value={parentQuestionSearchTerm}
                                                               oninput={handleParentQuestionSearch}
                                                               onfocus={handleParentQuestionFocus}
                                                               onblur={handleParentQuestionBlur}
                                                               autocomplete="off" 
                                                               role="textbox" />
                                                        <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                                                            <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#search"></use>
                                                            </svg>
                                                        </span>
                                                    </div>
                                                    <template if:true={isParentQuestionDropdownOpen}>
                                                        <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" 
                                                             role="listbox"
                                                             onmouseenter={handleDropdownMouseEnter}
                                                             onmouseleave={handleDropdownMouseLeave}>
                                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                                <template for:each={filteredParentQuestions} for:item="question">
                                                                    <li key={question.Id} role="presentation" class="slds-listbox__item">
                                                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" 
                                                                             role="option"
                                                                             data-question-id={question.Id}
                                                                             onclick={selectParentQuestion}>
                                                                            <span class="slds-media__body">
                                                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{question.Question__c}</span>
                                                                                <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">{question.Type__c}</span>
                                                                            </span>
                                                                        </div>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Condition Value -->
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label" for="dkedu-conditionValue">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            {label.DKEDU_AQ_LBL_RELATIONCONDITION}
                                        </label>
                                        <div class="slds-form-element__control">
                                            <template if:true={isParentQuestionChoiceBased}>
                                                <div class="slds-select_container">
                                                    <select class="slds-select" 
                                                            id="dkedu-conditionValueSelect"
                                                            data-condition-value="true"
                                                            onchange={handleConditionValueChange}>
                                                        <option value="">{label.DKEDU_AQ_MSG_CONDITIONDESCRIPTION}</option>
                                                        <template for:each={parentQuestionChoices} for:item="choice">
                                                            <option key={choice.value} value={choice.value} selected={choice.selected}>
                                                                {choice.label}
                                                            </option>
                                                        </template>
                                                    </select>
                                                </div>
                                            </template>
                                            <template if:false={isParentQuestionChoiceBased}>
                                                <input type="text" 
                                                       class="slds-input" 
                                                       id="dkedu-conditionValueInput"
                                                       placeholder={label.DKEDU_AQ_MSG_CONDITIONDESCRIPTION}
                                                       value={selectedConditionValue}
                                                       onchange={handleConditionValueChange} />
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- Image Toggle -->
                            <div class="slds-form-element">
                                <label class="slds-form-element__label" for="dkedu-imageToggle" style="font-weight:600;">
                                    {label.DKEDU_AQ_LBL_IMAGE}
                                </label>
                                <div class="slds-form-element__control">
                                    <div class="slds-checkbox">
                                        <input type="checkbox" 
                                               id="dkedu-imageToggle"
                                               onchange={handleImageToggle} />
                                        <label class="slds-checkbox__label" for="dkedu-imageToggle">
                                            <span class="slds-checkbox_faux"></span>
                                            <span class="slds-form-element__label slds-assistive-text">이미지 활성화</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleCancel}>
                        Cancel
                    </button>
                    <button class="slds-button slds-button_neutral" onclick={handleSaveAndNew} disabled={isLoading}>
                        <template if:true={isLoading}>
                            <span class="slds-spinner_container slds-spinner_inline">
                                <div role="status" class="slds-spinner slds-spinner_xx-small slds-spinner_inline">
                                    <span class="slds-assistive-text">Loading</span>
                                    <div class="slds-spinner__dot-a"></div>
                                    <div class="slds-spinner__dot-b"></div>
                                </div>
                            </span>
                        </template>
                        Save & New
                    </button>
                    <button class="slds-button slds-button_brand" onclick={handleSave} disabled={isLoading}>
                        <template if:true={isLoading}>
                            <span class="slds-spinner_container slds-spinner_inline">
                                <div role="status" class="slds-spinner slds-spinner_xx-small slds-spinner_inline">z
                                    <span class="slds-assistive-text">Loading</span>
                                    <div class="slds-spinner__dot-a"></div>
                                    <div class="slds-spinner__dot-b"></div>
                                </div>
                            </span>
                        </template>
                        Save
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </div>
</template>
