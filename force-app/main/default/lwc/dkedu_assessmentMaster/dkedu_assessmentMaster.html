<template>
    <!-- Modal Section with proper key for re-rendering -->
    <div key={renderKey}>
        <section class="slds-modal slds-fade-in-open slds-modal_large" 
                 role="dialog" 
                 tabindex="-1" 
                 aria-labelledby="modal-heading-01" 
                 aria-modal="true">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button type="button" 
                            title="Cancel and close" 
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-bare" 
                            onclick={handleCancel}>
                        <svg focusable="false" aria-hidden="true" viewBox="0 0 520 520" class="slds-button__icon slds-button__icon_large">
                            <g>
                                <path d="M310 254l130-131c6-6 6-15 0-21l-20-21c-6-6-15-6-21 0L268 212a10 10 0 01-14 0L123 80c-6-6-15-6-21 0l-21 21c-6 6-6 15 0 21l131 131c4 4 4 10 0 14L80 399c-6 6-6 15 0 21l21 21c6 6 15 6 21 0l131-131a10 10 0 0114 0l131 131c6 6 15 6 21 0l21-21c6-6 6-15 0-21L310 268a10 10 0 010-14z"></path>
                            </g>
                        </svg>
                        <span class="slds-assistive-text">Cancel and close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        New Assessment Master
                    </h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Required Field Indicator -->
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <div></div>
                        <div class="slds-text-align_right">
                            <span style="color: #c23934; font-size: 13px; font-weight: bold;">*</span>
                            <span class="slds-m-left_xx-small slds-text-body_small">= Required Information</span>
                        </div>
                    </div>

                    <!-- Basic Information Section -->
                    <section class="slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-theme_shade slds-p-around_small" 
                            style="border-radius: 0.5rem; font-size: 20px; padding: 0.25rem 0.75rem;">
                            Basic Information
                        </h3>
                        
                        <div class="slds-p-horizontal_small slds-p-top_small">
                            <div class="slds-grid slds-gutters slds-wrap">
                                <!-- Master Name -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="masterName">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            Master Name
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input type="text" 
                                                   id="masterName"
                                                   data-field="masterName"
                                                   class="slds-input" 
                                                   placeholder="Enter master name"
                                                   value={masterName}
                                                   oninput={handleInputChange} />
                                        </div>
                                    </div>
                                </div>

                                <!-- IsActive Checkbox -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium slds-p-top_large">
                                        <div class="slds-form-element__control">
                                            <div class="slds-checkbox">
                                                <input type="checkbox" 
                                                       id="isActive"
                                                       data-field="isActive" 
                                                       checked={isActive} 
                                                       onchange={handleCheckboxChange} />
                                                <label class="slds-checkbox__label" for="isActive">
                                                    <span class="slds-checkbox_faux"></span>
                                                    <span class="slds-form-element__label">Is Active</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Start Date -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="startDate">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            Start Date
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input type="date" 
                                                   id="startDate"
                                                   data-field="startDate"
                                                   class="slds-input" 
                                                   value={startDate}
                                                   onchange={handleDateChange} />
                                        </div>
                                    </div>
                                </div>

                                <!-- End Date -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="endDate">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            End Date
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input type="date" 
                                                   id="endDate"
                                                   data-field="endDate"
                                                   class="slds-input" 
                                                   value={endDate}
                                                   onchange={handleDateChange} />
                                        </div>
                                    </div>
                                </div>

                                <!-- Description -->
                                <div class="slds-col slds-size_1-of-1">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="description">
                                            Description
                                        </label>
                                        <div class="slds-form-element__control">
                                            <lightning-textarea
                                                name="description"
                                                data-field="description"
                                                label=""
                                                placeholder="Enter description"
                                                value={description}
                                                onchange={handleTextareaChange}
                                                max-length="1000">
                                            </lightning-textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Assessment Configuration Section -->
                    <section class="slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-theme_shade slds-p-around_small" 
                            style="border-radius: 0.5rem; font-size: 20px; padding: 0.25rem 0.75rem;">
                            Assessment Configuration
                        </h3>
                        
                        <div class="slds-p-horizontal_small slds-p-top_small">
                            <div class="slds-grid slds-gutters slds-wrap">
                                <!-- Assessment Template -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="assessmentTemplate">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            Assessment Template
                                        </label>
                                        <div class="slds-form-element__control">
                                            <div class="slds-combobox_container">
                                                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" 
                                                     aria-expanded={isTemplateDropdownOpen}
                                                     aria-haspopup="listbox" 
                                                     role="combobox">
                                                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                        <input type="text" 
                                                               class="slds-input slds-combobox__input" 
                                                               id="assessmentTemplate"
                                                               placeholder="Search templates..."
                                                               value={templateSearchTerm}
                                                               oninput={handleTemplateSearch}
                                                               onfocus={handleTemplateDropdownFocus}
                                                               onblur={handleTemplateDropdownBlur}
                                                               autocomplete="off" 
                                                               role="textbox" />
                                                        <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                                                            <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                        </span>
                                                    </div>
                                                    <template lwc:if={isTemplateDropdownOpen}>
                                                        <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" 
                                                             role="listbox"
                                                             onmouseenter={handleDropdownMouseEnter}
                                                             onmouseleave={handleDropdownMouseLeave}>
                                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                                <template for:each={filteredTemplateOptions} for:item="template">
                                                                    <li key={template.value} role="presentation" class="slds-listbox__item">
                                                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" 
                                                                             role="option"
                                                                             data-template-id={template.value}
                                                                             onclick={selectTemplate}>
                                                                            <span class="slds-media__body">
                                                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{template.label}</span>
                                                                                <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">{template.description}</span>
                                                                            </span>
                                                                        </div>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                        <template lwc:if={selectedTemplate}>
                                            <div class="slds-form-element__help">
                                                Selected: {selectedTemplate.label}
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Assessment Grade -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="assessmentGrade">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            Assessment Grade
                                        </label>
                                        <div class="slds-form-element__control">
                                            <div class="slds-combobox_container">
                                                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" 
                                                     aria-expanded={isGradeDropdownOpen}
                                                     aria-haspopup="listbox" 
                                                     role="combobox">
                                                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                        <input type="text" 
                                                               class="slds-input slds-combobox__input" 
                                                               id="assessmentGrade"
                                                               placeholder="Search grades..."
                                                               value={gradeSearchTerm}
                                                               oninput={handleGradeSearch}
                                                               onfocus={handleGradeDropdownFocus}
                                                               onblur={handleGradeDropdownBlur}
                                                               autocomplete="off" 
                                                               role="textbox" />
                                                        <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                                                            <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                        </span>
                                                    </div>
                                                    <template lwc:if={isGradeDropdownOpen}>
                                                        <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" 
                                                             role="listbox"
                                                             onmouseenter={handleDropdownMouseEnter}
                                                             onmouseleave={handleDropdownMouseLeave}>
                                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                                <template for:each={filteredGradeOptions} for:item="grade">
                                                                    <li key={grade.value} role="presentation" class="slds-listbox__item">
                                                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity" 
                                                                             role="option"
                                                                             data-grade-id={grade.value}
                                                                             onclick={selectGrade}>
                                                                            <span class="slds-media__body">
                                                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{grade.label}</span>
                                                                            </span>
                                                                        </div>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                        <template lwc:if={selectedGrade}>
                                            <div class="slds-form-element__help">
                                                Selected: {selectedGrade.label}
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Assessment Type (Select Box로 변경) -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="assessmentType">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            Assessment Type
                                        </label>
                                        <div class="slds-form-element__control">
                                            <div class="slds-select_container">
                                                <select class="slds-select" 
                                                        id="assessmentType"
                                                        data-field="assessmentType"
                                                        onchange={handleAssessmentTypeSelectChange}>
                                                    <option value="">Choose an assessment type...</option>
                                                    <template for:each={assessmentTypeOptions} for:item="assessmentType">
                                                        <option key={assessmentType.value} 
                                                                value={assessmentType.value}
                                                                selected={selectedAssessmentType}>
                                                            {assessmentType.label}
                                                        </option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                        <template lwc:if={selectedAssessmentType}>
                                            <div class="slds-form-element__help">
                                                Selected: {selectedAssessmentTypeLabel}
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Assign Type (Select Box로 변경) -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <label class="slds-form-element__label" for="assignType">
                                            <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                            Assign Type
                                        </label>
                                        <div class="slds-form-element__control">
                                            <div class="slds-select_container">
                                                <select class="slds-select" 
                                                        id="assignType"
                                                        data-field="assignType"
                                                        onchange={handleAssignTypeSelectChange}>
                                                    <option value="">Choose an assign type...</option>
                                                    <template for:each={assignTypeOptions} for:item="assignType">
                                                        <option key={assignType.value} 
                                                                value={assignType.value}
                                                                selected={selectedAssignType}>
                                                            {assignType.label}
                                                        </option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                        <template lwc:if={selectedAssignType}>
                                            <div class="slds-form-element__help">
                                                Selected: {selectedAssignTypeLabel}
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Assessment Target Section (Manual Only) -->
                    <template lwc:if={isManualAssign}>
                        <section class="slds-m-bottom_medium" data-contact-section="true">
                            <h3 class="slds-text-heading_small slds-theme_shade slds-p-around_small" 
                                style="border-radius: 0.5rem; font-size: 20px; padding: 0.25rem 0.75rem;">
                                Assessment Target
                            </h3>
                            
                            <div class="slds-p-horizontal_small slds-p-top_small">
                                <!-- Contact Search -->
                                <div class="slds-form-element slds-m-bottom_medium">
                                    <label class="slds-form-element__label" for="contactSearch">
                                        <abbr class="slds-required" title="required" style="color: #c23934;">*</abbr>
                                        Search Contacts
                                    </label>
                                    <div class="slds-form-element__control">
                                        <div class="slds-combobox_container">
                                            <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" 
                                                 aria-expanded={isContactDropdownOpen}
                                                 aria-haspopup="listbox" 
                                                 role="combobox">
                                                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                    <input type="text" 
                                                           class="slds-input slds-combobox__input" 
                                                           id="contactSearch"
                                                           placeholder="Search contacts by name..."
                                                           value={contactSearchTerm}
                                                           oninput={handleContactSearch}
                                                           onfocus={handleContactDropdownFocus}
                                                           onblur={handleContactDropdownBlur}
                                                           autocomplete="off" 
                                                           role="textbox" />
                                                    <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                                                        <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                    </span>
                                                </div>
                                                <template lwc:if={isContactDropdownOpen}>
                                                    <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" 
                                                         role="listbox"
                                                         onmouseenter={handleDropdownMouseEnter}
                                                         onmouseleave={handleDropdownMouseLeave}>
                                                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                            <template for:each={searchResults} for:item="contact">
                                                                <li key={contact.id} role="presentation" class="slds-listbox__item">
                                                                    <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" 
                                                                         role="option"
                                                                         data-contact-id={contact.id}
                                                                         onclick={selectContact}>
                                                                        <span class="slds-media__body">
                                                                            <span class="slds-listbox__option-text slds-listbox__option-text_entity">{contact.name}</span>
                                                                            <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">{contact.email} • {contact.account}</span>
                                                                        </span>
                                                                    </div>
                                                                </li>
                                                            </template>
                                                            <template lwc:if={hasSearchedContacts}>
                                                                <template lwc:if={hasSearchResults}>
                                                                </template>
                                                                <template lwc:else>
                                                                    <li role="presentation" class="slds-listbox__item">
                                                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity">
                                                                            <span class="slds-media__body">
                                                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">No contacts found</span>
                                                                            </span>
                                                                        </div>
                                                                    </li>
                                                                </template>
                                                            </template>
                                                        </ul>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Selected Targets -->
                                <template lwc:if={hasSelectedTargets}>
                                    <div class="selected-targets-container" key={selectedTargetCount}>
                                        <h4 class="slds-text-heading_small slds-m-bottom_small">
                                            Selected Targets ({selectedTargetCount})
                                        </h4>
                                        <div class="slds-grid slds-gutters slds-wrap">
                                            <template for:each={selectedTargets} for:item="target" for:index="index">
                                                <div key={target.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                                                    <div class="slds-card slds-card_boundary">
                                                        <div class="slds-card__body slds-card__body_inner">
                                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
                                                                <div class="slds-col slds-has-flexi-truncate" style="min-width: 0; flex: 1;">
                                                                    <div class="slds-truncate" 
                                                                         style="word-break: keep-all; white-space: nowrap; overflow: hidden;">
                                                                        <strong style="font-size: 1rem; font-weight: 700; color: #181818;" 
                                                                                title={target.name}>
                                                                            {target.name}
                                                                        </strong>
                                                                    </div>
                                                                    <template lwc:if={target.email}>
                                                                        <div class="slds-text-body_small slds-text-color_weak slds-truncate" 
                                                                             style="margin-top: 0.25rem; word-break: keep-all;" 
                                                                             title={target.email}>
                                                                            {target.email}
                                                                        </div>
                                                                    </template>
                                                                    <template lwc:if={target.account}>
                                                                        <div class="slds-text-body_small slds-text-color_weak slds-truncate" 
                                                                             style="margin-top: 0.125rem; word-break: keep-all;" 
                                                                             title={target.account}>
                                                                            {target.account}
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                                <div class="slds-col slds-no-flex" style="margin-left: 0.5rem;">
                                                                    <button type="button" 
                                                                            class="slds-button slds-button_icon slds-button_icon-border-filled"
                                                                            data-contact-id={target.id}
                                                                            onclick={handleRemoveTarget}
                                                                            title="Remove target">
                                                                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                                                        <span class="slds-assistive-text">Remove {target.name}</span>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>
                    </template>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleCancel}>
                        {labels.cancel}
                    </button>
                    <button class="slds-button slds-button_brand" onclick={handleSave} disabled={isLoading}>
                        <template lwc:if={isLoading}>
                            <span class="slds-spinner_container slds-spinner_inline">
                                <div role="status" class="slds-spinner slds-spinner_xx-small slds-spinner_inline">
                                    <span class="slds-assistive-text">Loading</span>
                                    <div class="slds-spinner__dot-a"></div>
                                    <div class="slds-spinner__dot-b"></div>
                                </div>
                            </span>
                                                        </template>
                        {labels.save}
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </div>
</template>
